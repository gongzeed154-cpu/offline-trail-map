<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>หน้าจอครู — เกมแผนที่</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
  :root { --green: #2e6b3f; --gold: #f5b301; --bg: #0f1d14; --panel: #17291d; --line: #28402e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  /* เวทีขนาดตายตัว 1920x1080 (16:9) — สเกลให้พอดีกับทุกหน้าจอ มีแถบดำถ้าสัดส่วนไม่ตรง */
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    background: var(--bg); color: #fff; font-family: "Sarabun", "Noto Sans Thai", -apple-system, "Segoe UI", "Segoe UI Emoji", sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  #hdr { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 30px; padding: 14px 36px; background: var(--panel); border-bottom: 3px solid var(--line); min-height: 170px; }
  #qno { font-size: 26px; color: var(--gold); font-weight: 700; }
  #prompt { font-size: 54px; font-weight: 800; line-height: 1.2; }
  #hint { font-size: 26px; opacity: .75; margin-top: 2px; }
  #timer { font-size: 120px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 170px; text-align: center; line-height: 1; }
  #timer.low { color: #ff6b5e; animation: pulse .5s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.12); } }
  #tbar { height: 12px; background: var(--line); }
  #tbarIn { height: 100%; background: var(--gold); width: 100%; }

  #main { display: grid; grid-template-columns: 1fr 640px; min-height: 0; }
  #mapWrap { position: relative; min-height: 0; background: #12301b; }
  #map { position: absolute; inset: 0; }
  #hdialWrap { position: absolute; z-index: 3; }
  #hdialWrap.full { inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 45%, #1d4d2b, #0f1d14 80%); }
  #hdialWrap.full #hdial { width: 740px; height: 740px; }
  #hdialWrap.corner { right: 16px; bottom: 16px; background: rgba(15,29,20,.82); border-radius: 20px; padding: 8px; }
  #hdialWrap.corner #hdial { width: 380px; height: 380px; }
  #answered { position: absolute; z-index: 4; left: 20px; bottom: 20px; right: 20px; background: rgba(15,29,20,.9); border-radius: 18px; padding: 14px 24px; font-size: 30px; }
  #hdialWrap.corner ~ #answered { right: 430px; }
  #aBar { height: 14px; background: var(--line); border-radius: 7px; margin-top: 8px; overflow: hidden; }
  #aIn { height: 100%; background: #5fd07a; width: 0; transition: width .3s; }
  #revealBox { position: absolute; z-index: 4; left: 20px; top: 20px; background: rgba(255,255,255,.96); color: #1b1b1b; border-radius: 18px; padding: 16px 26px; font-size: 34px; max-width: 900px; }
  #revealBox b { color: var(--green); }
  #revealBox small { font-size: 24px; }
  #caption { position: absolute; z-index: 5; left: 50%; transform: translateX(-50%); bottom: 130px; max-width: 1000px; background: rgba(0,0,0,.72); border-radius: 28px; padding: 10px 28px; font-size: 28px; text-align: center; }

  #side { background: var(--panel); border-left: 3px solid var(--line); padding: 20px 24px; display: flex; flex-direction: column; min-height: 0; }
  #side h2 { margin: 0 0 4px; font-size: 34px; }
  #avg { font-size: 24px; opacity: .88; margin-bottom: 12px; }
  #avg b { color: var(--gold); font-size: 36px; }
  #lb { position: relative; flex: 1; }
  .row { position: absolute; left: 0; right: 0; height: 70px; display: flex; align-items: center; gap: 10px; transition: transform .6s cubic-bezier(.3,.8,.3,1); }
  .rk { width: 36px; text-align: center; font-size: 30px; font-weight: 800; color: var(--gold); }
  .av { width: 56px; height: 56px; border-radius: 28px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 34px; border: 4px solid #fff; flex: none; }
  .rb { flex: 1; position: relative; height: 56px; background: #22382a; border-radius: 10px; overflow: hidden; }
  .rf { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #2e6b3f, #4fa866); border-radius: 10px; transition: width .6s; }
  .rn { position: absolute; left: 14px; right: 116px; top: 0; bottom: 0; display: flex; align-items: center; font-size: 27px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rp { position: absolute; right: 14px; top: 0; bottom: 0; display: flex; align-items: center; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }

  #ctrl { position: absolute; right: 14px; bottom: 10px; z-index: 40; display: flex; gap: 8px; opacity: .35; transition: opacity .2s; }
  #ctrl:hover { opacity: 1; }
  #ctrl button { background: #2a4733; color: #fff; border: 0; border-radius: 10px; padding: 9px 14px; font-size: 18px; }
  #ctrl button.off { opacity: .45; text-decoration: line-through; }

  .overlay { position: absolute; inset: 0; z-index: 20; background: radial-gradient(circle at 30% 20%, #1f4d2c, #0f1d14 70%); display: flex; align-items: center; justify-content: center; padding: 30px; }
  #lobby { gap: 80px; }
  #qrBox { background: #fff; padding: 24px; border-radius: 30px; text-align: center; color: #1b1b1b; flex: none; }
  #qrBox img { width: 470px; height: 470px; image-rendering: pixelated; display: block; }
  #qrBox div { margin-top: 10px; font-size: 24px; font-weight: 600; word-break: break-all; max-width: 470px; }
  #lobbyInfo { flex: 1; max-width: 1000px; display: flex; flex-direction: column; height: 960px; }
  #lobbyInfo h1 { font-size: 76px; margin: 0 0 2px; }
  #lobbyInfo p { font-size: 30px; margin: 2px 0 8px; opacity: .9; }
  #cntRow { display: flex; align-items: baseline; gap: 18px; }
  #cnt { font-size: 130px; font-weight: 800; color: var(--gold); line-height: 1; }
  #names { flex: 1; min-height: 0; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 9px; overflow: hidden; margin: 10px 0 16px; }
  .pc { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); border-radius: 30px; padding: 4px 18px 4px 4px; font-size: 23px; font-weight: 600; animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  .pc .a { width: 46px; height: 46px; border-radius: 23px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; border: 4px solid #fff; }
  @keyframes pop { from { transform: scale(.2) rotate(-12deg); opacity: 0; } }
  #startBtn { background: var(--gold); color: #3a2a00; border: 0; border-radius: 50px; font-size: 44px; font-weight: 800; padding: 16px 70px; align-self: flex-start; animation: glow 1.6s infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 40px 8px rgba(245,179,1,.55); } }
  #startBtn:disabled { opacity: .4; animation: none; }
  #toasts { position: absolute; right: 24px; top: 24px; z-index: 50; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: none; }
  .toast { background: rgba(245,179,1,.95); color: #3a2a00; border-radius: 30px; padding: 10px 26px; font-size: 28px; font-weight: 700; animation: slideIn .4s, fadeOut .5s 2.6s forwards; }
  @keyframes slideIn { from { transform: translateX(120%); } }
  @keyframes fadeOut { to { opacity: 0; transform: translateY(-14px); } }
  #soundBanner { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 60; background: #fff; color: #1b1b1b; border-radius: 36px; padding: 8px 30px; font-size: 26px; font-weight: 700; animation: glow 1.6s infinite; white-space: nowrap; }
  #count { flex-direction: column; text-align: center; }
  #count .n { font-size: 340px; font-weight: 800; color: var(--gold); line-height: 1; animation: pulse2 1s infinite; }
  @keyframes pulse2 { 0% { transform: scale(1.3); opacity: .3; } 35% { transform: scale(1); opacity: 1; } }
  #count .t { font-size: 60px; }
  #final { flex-direction: column; justify-content: flex-start; padding-top: 30px; overflow: hidden; }
  #final h1 { margin: 0; font-size: 64px; }
  #final .avgbig { font-size: 34px; margin: 2px 0 6px; opacity: .9; }
  #final .avgbig b { color: var(--gold); }
  #podium { display: flex; align-items: flex-end; gap: 40px; height: 470px; margin-top: 8px; }
  .pod { width: 330px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; animation: rise 1s backwards; }
  .pod .pa { font-size: 90px; background: #fff; border-radius: 50%; width: 124px; height: 124px; display: flex; align-items: center; justify-content: center; border: 7px solid #fff; }
  .pod .pn { font-size: 36px; font-weight: 800; margin-top: 6px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pod .pp { font-size: 40px; font-weight: 800; color: var(--gold); }
  .pod .pb { width: 100%; border-radius: 14px 14px 0 0; margin-top: 6px; display: flex; align-items: flex-start; justify-content: center; font-size: 70px; font-weight: 800; padding-top: 4px; }
  @keyframes rise { from { transform: translateY(700px); opacity: 0; } }
  #finalLb { position: relative; width: 1000px; flex: 1; margin-top: 10px; }
  #finalLb .row { height: 58px; } #finalLb .av { width: 48px; height: 48px; font-size: 30px; border-width: 3px; }
  #finalLb .rb { height: 48px; } #finalLb .rn { font-size: 27px; } #finalLb .rp { font-size: 29px; } #finalLb .rk { font-size: 29px; }
  #confetti { position: absolute; inset: 0; z-index: 70; pointer-events: none; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="stage">
<div id="app">
  <div>
    <div id="hdr">
      <div>
        <div id="qno"></div>
        <div id="prompt"></div>
        <div id="hint"></div>
      </div>
      <div id="timer"></div>
    </div>
    <div id="tbar"><div id="tbarIn"></div></div>
  </div>
  <div id="main">
    <div id="mapWrap">
      <div id="map"></div>
      <div id="hdialWrap" hidden><div id="hdial"></div></div>
      <div id="answered"><span id="aTxt"></span><div id="aBar"><div id="aIn"></div></div></div>
      <div id="revealBox" hidden></div>
      <div id="caption" hidden></div>
    </div>
    <div id="side">
      <h2>🏆 คะแนนรวมสด</h2>
      <div id="avg"></div>
      <div id="lb"></div>
    </div>
  </div>
</div>

<div id="lobby" class="overlay">
  <div id="qrBox"><img id="qrImg" alt="QR"><div id="url"></div><div id="urlNote" style="font-size:15px;font-weight:400;margin-top:4px"></div></div>
  <div id="lobbyInfo">
    <h1 id="gTitle">🗺️ เกมแผนที่</h1>
    <p>สแกน QR → เลือกตัวละคร → ตั้งชื่อ เข้าร่วมได้เลย!</p>
    <div id="cntRow"><div id="cnt">0</div><div style="font-size:26px">คนเข้าร่วมแล้ว</div></div>
    <div id="names"></div>
    <button id="startBtn" disabled>▶ เริ่มเกม</button>
  </div>
</div>

<div id="count" class="overlay" hidden><div class="t">เตรียมตัว!</div><div class="n" id="cn"></div><div class="t" id="cTxt"></div></div>

<div id="final" class="overlay" hidden>
  <h1>🏁 สรุปคะแนน</h1>
  <div class="avgbig">เฉลี่ยทั้งห้อง <b id="fAvg"></b> · ผู้เล่น <span id="fN"></span> คน</div>
  <div id="podium"></div>
  <div id="finalLb"></div>
</div>

<div id="toasts"></div>
<canvas id="confetti" hidden></canvas>
<div id="soundBanner">🔊 คลิก/กดปุ่มใดก็ได้ เพื่อเปิดเสียงเพลงและเสียงพูด</div>
<div id="ctrl">
  <button id="bMusic" title="เพลง (M)">🎵</button><button id="bSfx" title="เอฟเฟกต์">🔊</button><button id="bVoice" title="เสียงพูด AI (V)">🗣️</button>
  <button id="bSkip">ข้าม ▶</button><button id="bReset">รีเซ็ต</button><button id="bClear">ล้างรายชื่อ</button>
</div>

</div><!-- /stage -->

<script src="lib/maplibre-gl.js"></script>
<script src="qrcode.min.js"></script>
<script src="qmap.js"></script>
<script src="dial.js"></script>
<script src="audio.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var A = window.GameAudio;
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function cmd(c, k) { fetch('api/host', { method: 'POST', body: JSON.stringify({ cmd: c, k: k }) }); }
  var S = null, offset = 0, qMs = 25000, unlocked = false;
  function fitStage() { var s = Math.min(innerWidth / 1920, innerHeight / 1080); $('stage').style.transform = 'translate(' + (-960 * s) + 'px,' + (-540 * s) + 'px) scale(' + s + ')'; }
  fitStage(); addEventListener('resize', fitStage);
  var prev = { phase: '', qi: -2, names: 0 };

  // ---------- ปุ่มควบคุม / เสียง ----------
  $('startBtn').onclick = function () { cmd('start'); };
  $('bSkip').onclick = function () { cmd('skip'); };
  $('bReset').onclick = function () { cmd('reset'); };
  $('bClear').onclick = function () { if (confirm('ล้างรายชื่อผู้เล่นทั้งหมด?')) cmd('clear'); };
  function syncBtns() { $('bMusic').className = A.state.music ? '' : 'off'; $('bSfx').className = A.state.sfx ? '' : 'off'; $('bVoice').className = A.state.voice ? '' : 'off'; }
  $('bMusic').onclick = function () { A.toggle('music'); syncBtns(); };
  $('bSfx').onclick = function () { A.toggle('sfx'); syncBtns(); };
  $('bVoice').onclick = function () { A.toggle('voice'); syncBtns(); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') cmd('skip');
    if (e.key === ' ' && S && S.phase === 'lobby') { e.preventDefault(); cmd('start'); }
    if (e.key === 'm' || e.key === 'M') { A.toggle('music'); syncBtns(); }
    if (e.key === 'v' || e.key === 'V') { A.toggle('voice'); syncBtns(); }
  });
  function unlock() {
    if (unlocked) return; unlocked = true; A.unlock(); $('soundBanner').hidden = true;
    if (!A.hasVoice()) toast('ℹ️ ไม่พบเสียงพูดภาษาไทยในเบราว์เซอร์นี้ (Microsoft Edge มีเสียง Natural)');
    if (S) audioFor(S, true);
  }
  ['pointerdown', 'keydown'].forEach(function (ev) { document.addEventListener(ev, unlock); });

  var capTimer = null;
  function say(text) {
    $('caption').textContent = text; $('caption').hidden = false; clearTimeout(capTimer);
    capTimer = setTimeout(function () { $('caption').hidden = true; }, 6500);
    if (unlocked) A.say(text);
  }
  function toast(t) {
    var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; $('toasts').appendChild(d);
    while ($('toasts').children.length > 4) $('toasts').firstChild.remove();
    setTimeout(function () { d.remove(); }, 3200);
  }

  // ---------- QR ----------
  var shownUrl = '';
  function loadInfo() {
    fetch('api/info').then(function (r) { return r.json(); }).then(function (i) {
      $('gTitle').textContent = '🗺️ ' + i.title;
      if (i.url !== shownUrl) {
        shownUrl = i.url; $('url').textContent = i.url;
        var q = qrcode(0, 'M'); q.addData(i.url); q.make(); $('qrImg').src = q.createDataURL(10, 2);
      }
      $('url').style.color = i.public ? '#1b1b1b' : '#b3261e';
      $('urlNote').textContent = i.public ? 'ใช้เน็ตมือถือได้เลย ไม่ต้องต่อ Wi-Fi เดียวกัน'
        : (i.tunnel === 'starting' ? '⏳ กำลังสร้างลิงก์สาธารณะ… (QR จะเปลี่ยนเองเมื่อพร้อม)' : '⚠ ลิงก์นี้ใช้ได้เฉพาะ Wi-Fi วงเดียวกับครู');
      if (!i.public && i.tunnel === 'starting') setTimeout(loadInfo, 1500);
    }).catch(function () { setTimeout(loadInfo, 2000); });
  }
  loadInfo();

  // ---------- แผนที่ ----------
  var qm = QMap.create({ container: 'map', pad: { top: 30, bottom: 90, left: 30, right: 30 }, maxZoom: 15 });
  var map = qm.map, empty = { type: 'FeatureCollection', features: [] };
  qm.whenReady(function () {
    map.addSource('pins', { type: 'geojson', data: empty });
    map.addSource('ans', { type: 'geojson', data: empty });
    map.addLayer({ id: 'pins', type: 'circle', source: 'pins', paint: {
      'circle-radius': 7, 'circle-stroke-color': '#fff', 'circle-stroke-width': 1.5, 'circle-opacity': .9,
      'circle-color': ['interpolate', ['linear'], ['get', 'pct'], 0, '#d93025', 50, '#f5b301', 100, '#2e9d4f'] } });
    map.addLayer({ id: 'ans-ring', type: 'circle', source: 'ans', paint: { 'circle-radius': 16, 'circle-color': 'rgba(46,107,63,.25)', 'circle-stroke-color': '#1d5b2d', 'circle-stroke-width': 3 } });
    map.addLayer({ id: 'ans', type: 'circle', source: 'ans', paint: { 'circle-radius': 5, 'circle-color': '#1d5b2d' } });
    map.resize();
  });
  var dial = Dial.create($('hdial'), { dark: true });

  // ---------- อันดับสด ----------
  function drawLB(el, list, rowH) {
    var h = rowH || 52, seen = {};
    list.forEach(function (x, i) {
      seen[x.k] = 1;
      var r = el.querySelector('[data-k="' + x.k + '"]');
      if (!r) {
        r = document.createElement('div'); r.className = 'row'; r.dataset.k = x.k;
        r.innerHTML = '<div class="rk"></div><div class="av"></div><div class="rb"><div class="rf"></div><div class="rn"></div><div class="rp"></div></div>';
        r.style.transform = 'translateY(' + (i * h) + 'px)'; el.appendChild(r);
      }
      r.style.transform = 'translateY(' + (i * h) + 'px)';
      r.querySelector('.rk').textContent = i + 1;
      var av = r.querySelector('.av'); av.textContent = x.av || '🙂'; av.style.borderColor = x.color || '#fff';
      r.querySelector('.rn').textContent = x.name;
      r.querySelector('.rp').textContent = x.pct.toFixed(1) + '%';
      r.querySelector('.rf').style.width = x.pct + '%';
    });
    [].slice.call(el.children).forEach(function (r) { if (!seen[r.dataset.k]) r.remove(); });
  }

  // ---------- ห้องรอ: บัตรตัวละครเด้งเข้ามา ----------
  function drawLobby(s) {
    $('cnt').textContent = s.players; $('startBtn').disabled = s.players === 0;
    var box = $('names'), keep = {};
    (s.names || []).forEach(function (n) {
      keep[n.k] = 1;
      if (!box.querySelector('[data-k="' + n.k + '"]')) {
        var d = document.createElement('div'); d.className = 'pc'; d.dataset.k = n.k; d.title = 'ดับเบิลคลิกเพื่อเชิญออก';
        d.innerHTML = '<div class="a" style="border-color:' + esc(n.color) + '">' + esc(n.av) + '</div>' + esc(n.name);
        d.ondblclick = function () { cmd('kick', n.k); };
        box.appendChild(d);
      }
    });
    [].slice.call(box.children).forEach(function (d) { if (!keep[d.dataset.k]) d.remove(); });
    // ผู้เล่นใหม่ -> เสียง + ป้ายแจ้ง
    if (prev.names && s.players > prev.names.count) {
      var old = prev.names.set, fresh = (s.names || []).filter(function (n) { return !old[n.k]; });
      if (fresh.length) { A.sfx('join'); fresh.slice(-2).forEach(function (n) { toast('🎉 ' + n.av + ' ' + n.name + ' เข้าร่วมแล้ว!'); }); }
    }
    var set = {}; (s.names || []).forEach(function (n) { set[n.k] = 1; });
    prev.names = { count: s.players, set: set };
  }

  // ---------- เสียงตามช่วงเกม ----------
  function audioFor(s, force) {
    if (!unlocked) return;
    if (s.phase === 'lobby') A.music.play('lobby');
    else if (s.phase === 'final') A.music.play('final');
    else A.music.play('game');
  }

  var confettiRun = false;
  function confetti() {
    var c = $('confetti'); c.hidden = false; c.width = 1920; c.height = 1080;
    var g = c.getContext('2d'), ps = [], cols = ['#f5b301', '#e53935', '#43a047', '#1e88e5', '#8e24aa', '#fff'];
    for (var i = 0; i < 220; i++) ps.push({ x: Math.random() * c.width, y: -Math.random() * c.height, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: 4 + Math.random() * 6, c: cols[i % cols.length], a: Math.random() * 6, va: (Math.random() - .5) * .3 });
    var t0 = Date.now(); confettiRun = true;
    (function f() {
      if (!confettiRun || Date.now() - t0 > 9000) { g.clearRect(0, 0, c.width, c.height); c.hidden = true; return; }
      g.clearRect(0, 0, c.width, c.height);
      ps.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.a += p.va; if (p.y > c.height) { p.y = -10; p.x = Math.random() * c.width; }
        g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); g.restore(); });
      requestAnimationFrame(f);
    })();
  }

  function showDial(mode) { // mode: 'full' | 'corner' | null
    $('hdialWrap').hidden = !mode; $('hdialWrap').className = mode || '';
    $('map').style.visibility = mode === 'full' ? 'hidden' : 'visible';
  }

  function render(s) {
    var phaseChanged = s.phase !== prev.phase, qChanged = s.qi !== prev.qi;
    var inGame = s.phase === 'question' || s.phase === 'reveal';
    $('lobby').hidden = s.phase !== 'lobby';
    $('count').hidden = s.phase !== 'countdown';
    $('final').hidden = s.phase !== 'final';
    if (s.phase !== 'final') confettiRun = false;

    if (phaseChanged) audioFor(s);
    if (s.phase === 'lobby') drawLobby(s);
    if (s.phase === 'countdown') {
      $('cTxt').textContent = 'ผู้เล่น ' + s.players + ' คน · ' + s.total + ' ข้อ';
      if (phaseChanged) say('ศึก' + (s.title.replace('ศึก', '') || 'อ่านแผนที่') + ' กำลังจะเริ่ม! ผู้เล่น ' + s.players + ' คน เตรียมตัวให้พร้อม');
    }
    if (inGame) {
      var q = s.q, isCompass = q.type === 'compass', hasMarkers = q.markers && q.markers.length > 1;
      $('qno').textContent = 'ข้อ ' + (s.qi + 1) + ' / ' + s.total;
      $('prompt').textContent = q.prompt; $('hint').textContent = q.hint || '';
      $('avg').innerHTML = 'ค่าเฉลี่ยทั้งห้อง <b>' + s.avg.toFixed(1) + '%</b> · ผู้เล่น ' + s.players + ' คน';
      drawLB($('lb'), s.top);
      if (s.phase === 'question') {
        $('answered').hidden = false; $('revealBox').hidden = true;
        $('aTxt').textContent = 'ตอบแล้ว ' + s.answered + ' / ' + s.connected + ' คน';
        $('aIn').style.width = (s.connected ? s.answered / s.connected * 100 : 0) + '%';
      } else $('answered').hidden = true;

      if (qChanged || phaseChanged) {
        if (s.phase === 'question') {
          qMs = Math.max(1000, s.deadline - s.now); A.music.setRate(1);
          A.sfx('whoosh'); say('ข้อที่ ' + (s.qi + 1) + ' ' + (q.say || q.prompt));
          $('revealBox').hidden = true;
          qm.whenReady(function () { map.getSource('pins').setData(empty); map.getSource('ans').setData(empty); });
          qm.pad = { top: 30, bottom: 90, left: 30, right: 30 };
          if (isCompass) {
            dial.setTarget(null); dial.setHist(null); dial.setAngle(null);
            if (hasMarkers) { showDial('corner'); qm.pad = { top: 30, bottom: 90, left: 30, right: 600 }; qm.setQuestion(q); }
            else showDial('full');
          } else { showDial(null); qm.setQuestion(q); }
        } else { // reveal
          A.sfx('reveal'); A.music.setRate(1);
          var t = s.reveal, lead = s.top[0];
          var msg = isCompass ? 'เฉลย ' + Math.round(t.angle) + ' องศา ' : 'เฉลย ' + t.name + ' ';
          say(msg + 'ค่าเฉลี่ยข้อนี้ ' + Math.round(s.qAvg) + ' เปอร์เซ็นต์' + (lead ? ' ผู้นำตอนนี้คือ ' + lead.name : ''));
          $('revealBox').hidden = false;
          if (isCompass) {
            $('revealBox').innerHTML = '✅ เฉลย: <b>' + Math.round(t.angle) + '°</b> — ' + esc(t.name) + '<br><small>คะแนนเฉลี่ยข้อนี้ ' + s.qAvg.toFixed(1) + '% · แท่งสีเหลือง = จำนวนคนที่ตอบในมุมนั้น (วงนอก)</small>';
            dial.setTarget(t.angle); dial.setHist(s.pins);
            if (hasMarkers) qm.setAux([[q.markers[0].lng, q.markers[0].lat], [q.markers[1].lng, q.markers[1].lat]]);
          } else {
            var extra = t.type === 'dms' && t.dmsText ? '<br><b>' + esc(t.dmsText) + '</b>' : '';
            $('revealBox').innerHTML = '✅ คำตอบ: <b>' + esc(t.name) + '</b>' + extra + '<br><small>คะแนนเฉลี่ยข้อนี้ ' + s.qAvg.toFixed(1) + '% · เต็ม 100% = ตรงจุด, 0% = ห่างเกิน ' + t.maxKm + ' กม.</small>';
            qm.whenReady(function () {
              qm.setLabels(true);
              map.getSource('ans').setData({ type: 'Feature', geometry: { type: 'Point', coordinates: [t.lng, t.lat] } });
              map.getSource('pins').setData({ type: 'FeatureCollection', features: (s.pins || []).map(function (p) {
                return { type: 'Feature', properties: { pct: p.pct }, geometry: { type: 'Point', coordinates: [p.lng, p.lat] } };
              }) });
              var pts = [[t.lng, t.lat]];
              (s.pins || []).forEach(function (p) { if (p.pct > 5) pts.push([p.lng, p.lat]); });
              qm.pad = { top: 120, bottom: 70, left: 70, right: 70 };
              map.setMaxBounds(null);
              qm.fitPoints(pts, { maxZoom: q.frame ? 14 : 9, pad: qm.pad });
            });
          }
        }
      }
      if (s.phase === 'reveal' && isCompass && s.pins) dial.setHist(s.pins);
    }
    if (s.phase === 'final') {
      $('fAvg').textContent = s.avg.toFixed(1) + '%'; $('fN').textContent = s.players;
      if (phaseChanged) {
        var w = s.top[0];
        A.sfx('fanfare'); setTimeout(function () { A.sfx('applause'); }, 900);
        if (w) say('จบเกมแล้ว! ผู้ชนะคือ ' + w.name + ' ด้วยคะแนน ' + Math.round(w.pct) + ' เปอร์เซ็นต์ ขอแสดงความยินดี! อันดับสองคือ ' + ((s.top[1] && s.top[1].name) || '') + ' และอันดับสามคือ ' + ((s.top[2] && s.top[2].name) || ''));
        confetti();
        var order = [1, 0, 2], hs = [62, 100, 44], cols = ['#c0c7cf', '#f5b301', '#cd7f32'];
        $('podium').innerHTML = order.map(function (idx, n) {
          var p = s.top[idx]; if (!p) return '<div class="pod"></div>';
          return '<div class="pod" style="animation-delay:' + (n === 1 ? 1.6 : n === 0 ? 0.8 : 0.2) + 's"><div class="pa" style="border-color:' + esc(p.color) + '">' + esc(p.av) + '</div><div class="pn">' + esc(p.name) + '</div><div class="pp">' + p.pct.toFixed(1) + '%</div>' +
            '<div class="pb" style="height:' + hs[n] * 2.4 + 'px;background:' + cols[n] + ';color:#2b2b2b">' + (idx + 1) + '</div></div>';
        }).join('');
      }
      var rest = s.top.slice(3), fl = $('finalLb');
      var rh = Math.max(40, fl.clientHeight / 7);
      var shifted = rest.map(function (x) { return x; });
      drawLB(fl, shifted, rh);
      [].forEach.call(fl.querySelectorAll('.rk'), function (e, i) { e.textContent = i + 4; });
    }
    prev.phase = s.phase; prev.qi = s.qi;
  }

  // ตัวเลขเวลา + เสียงนับถอยหลัง
  var lastSec = -1;
  setInterval(function () {
    if (!S) return;
    var left = S.deadline - (Date.now() + offset), sec = Math.max(0, Math.ceil(left / 1000));
    if (S.phase === 'countdown') {
      $('cn').textContent = Math.max(1, sec);
      if (sec !== lastSec && sec >= 1 && sec <= 5) { lastSec = sec; A.sfx('tick'); }
    }
    if (S.phase === 'question') {
      $('timer').textContent = sec; $('timer').className = sec <= 5 ? 'low' : '';
      $('tbarIn').style.width = Math.max(0, Math.min(100, left / qMs * 100)) + '%';
      if (sec <= 5 && sec >= 1 && sec !== lastSec) { lastSec = sec; A.sfx('tick'); A.music.setRate(1.18); }
    } else if (S.phase === 'reveal') { $('timer').textContent = '✓'; $('timer').className = ''; $('tbarIn').style.width = '0'; }
    else $('timer').textContent = '';
  }, 100);

  syncBtns();
  var es = new EventSource('api/host/stream');
  es.onmessage = function (e) { S = JSON.parse(e.data); offset = S.now - Date.now(); render(S); };
})();
</script>
</body>
</html>
