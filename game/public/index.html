<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เกมแผนที่</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2e6b3f">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
  :root { --green: #2e6b3f; --dark: #14301c; --red: #d93025; --gold: #f5b301; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    font-family: -apple-system, "Sarabun", "Noto Sans Thai", sans-serif; background: #dfe8ee; color: #1b1b1b; }
  #map { position: fixed; inset: 0; }
  #cover { position: fixed; inset: 0; z-index: 2; background: radial-gradient(circle at 50% 40%, #2a6a3b, #12301b 75%); }
  button { font-family: inherit; }
  [hidden] { display: none !important; }

  #top { position: fixed; left: 0; right: 0; top: 0; z-index: 5; padding: calc(env(safe-area-inset-top) + 8px) 10px 0; pointer-events: none; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.3); padding: 10px 14px; pointer-events: auto; }
  #qn { font-size: 13px; color: #666; display: flex; justify-content: space-between; align-items: center; }
  #tleft { font-size: 22px; font-weight: 800; color: var(--green); }
  #prompt { font-size: 18px; font-weight: 700; line-height: 1.3; margin-top: 2px; }
  #hint { font-size: 13px; color: #555; margin-top: 3px; }
  #bar { height: 6px; background: #e4e4e4; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  #barIn { height: 100%; width: 100%; background: var(--green); }
  #barIn.low { background: var(--red); }

  #bottom { position: fixed; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px); z-index: 5; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  #readout { align-self: center; background: rgba(0,0,0,.75); color: #fff; font: 600 14px ui-monospace, Menlo, monospace; padding: 6px 12px; border-radius: 16px; }
  .btn { height: 52px; border: 0; border-radius: 26px; background: var(--green); color: #fff; font-size: 19px; font-weight: 700; box-shadow: 0 3px 10px rgba(0,0,0,.35); }
  .btn:disabled { background: #8aa592; }
  #result { text-align: center; }
  #result .big { font-size: 32px; font-weight: 800; color: var(--green); line-height: 1.1; }
  #result .sub { font-size: 14px; color: #444; margin-top: 3px; }
  #result .tot { margin-top: 7px; padding-top: 7px; border-top: 1px solid #e3e3e3; font-size: 14px; }
  #result b { font-size: 18px; }

  /* กรอกพิกัด */
  #pDms { padding: 8px 10px; }
  .dline { display: flex; align-items: center; gap: 4px; justify-content: center; margin-bottom: 6px; font-weight: 700; }
  .dline .h { width: 22px; font-size: 16px; color: var(--green); text-align: center; }
  .df { min-width: 54px; height: 42px; border: 2px solid #cfd8d2; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; background: #f7faf8; }
  .df.act { border-color: var(--green); background: #e6f3ea; box-shadow: 0 0 0 3px rgba(46,107,63,.2); }
  .du { font-size: 20px; color: #666; margin-right: 4px; }
  #keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 4px; }
  #keys button { height: 38px; border: 0; border-radius: 9px; background: #eef2ef; font-size: 20px; font-weight: 700; color: #222; }
  #keys button:active { background: #cfe3d5; }
  #keys .nx { background: #dcecdf; color: var(--green); }

  /* เข็มทิศ */
  #pDial { padding: 8px 10px 10px; text-align: center; }
  #dialHost { width: min(60vw, 230px); height: min(60vw, 230px); margin: 0 auto; }
  #dialHost.big { width: min(78vw, 330px); height: min(78vw, 330px); }
  #dRead { font-size: 22px; font-weight: 800; color: var(--green); min-height: 28px; margin-top: 2px; }
  #dRead small { font-size: 14px; color: #666; font-weight: 600; }

  /* หน้าจอเต็ม */
  #screen { position: fixed; inset: 0; z-index: 10; background: linear-gradient(160deg, #1f4d2c, #2e6b3f 60%, #4b8f5c); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 18px; gap: 11px; overflow-y: auto; }
  #screen h1 { margin: 0; font-size: 28px; }
  #screen p { margin: 0; font-size: 16px; opacity: .92; }
  #screen input { width: 100%; max-width: 330px; height: 48px; border: 0; border-radius: 24px; padding: 0 18px; font-size: 18px; text-align: center; font-family: inherit; user-select: text; -webkit-user-select: text; }
  #screen .go { width: 100%; max-width: 330px; height: 52px; border: 0; border-radius: 26px; background: var(--gold); color: #3a2a00; font-size: 19px; font-weight: 800; }
  .count { font-size: 120px; font-weight: 800; line-height: 1; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1.25); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
  .pct { font-size: 72px; font-weight: 800; line-height: 1; color: var(--gold); }
  .spin { width: 30px; height: 30px; border: 4px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .pin { width: 30px; height: 40px; }
  #myScore { font-weight: 800; color: var(--green); font-size: 14px; }
  #pChoice { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  #pChoice button { border: 3px solid #cfd8d2; background: #f7faf8; border-radius: 14px; padding: 10px 12px; font-size: 17px; font-weight: 700; text-align: left; display: flex; align-items: center; gap: 10px; color: #222; }
  #pChoice button .l { width: 30px; height: 30px; border-radius: 15px; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; flex: none; }
  #pChoice button.sel { border-color: var(--green); background: #e6f3ea; box-shadow: 0 0 0 3px rgba(46,107,63,.2); }
  #pChoice button.ok { border-color: #2e9d4f; background: #d5f2dc; }
  #pChoice button.bad { border-color: #d93025; background: #fde4e1; }
  #pDial.night { background: #0a120b; }
  #pDial.night #dRead { color: #b6ffb6; } #pDial.night #dRead small { color: #8fd18f; }
  #screen.gold { background: linear-gradient(160deg, #7a5a00, #d4a017 55%, #ffe98a); color: #2a1d00; }
  #screen.silver { background: linear-gradient(160deg, #424c57, #aab4bf 55%, #f1f4f7); color: #1b232b; }
  #screen.bronze { background: linear-gradient(160deg, #54300f, #b8732e 55%, #f2cfa6); color: #2a1604; }
  #screen.top10 { background: linear-gradient(160deg, #123a63, #1e6fb3 55%, #7cc4ff); }
  .medal { font-size: 120px; line-height: 1; animation: medal 1.5s cubic-bezier(.2,1.5,.4,1); filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
  @keyframes medal { from { transform: scale(0) rotate(-180deg); opacity: 0; } }
  .me.shine { animation: bob 1.6s ease-in-out infinite, ring 1.6s ease-in-out infinite; }
  @keyframes ring { 50% { box-shadow: 0 0 0 14px rgba(255,255,255,.45), 0 0 40px 10px rgba(255,235,120,.9); } }
  .cheer { max-width: 330px; font-size: 18px; line-height: 1.5; padding: 10px 14px; background: rgba(255,255,255,.14); border-radius: 16px; }
  .fxc { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
  #screen .pct.dark { color: inherit; }

  /* เลือกตัวละคร */
  #picker { width: 100%; max-width: 340px; }
  #tabs { display: flex; gap: 5px; justify-content: center; margin-bottom: 7px; }
  #tabs button { flex: 1; border: 0; border-radius: 14px; padding: 6px 2px; background: rgba(255,255,255,.18); color: #fff; font-size: 13px; font-weight: 700; }
  #tabs button.on { background: #fff; color: var(--green); }
  #avs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  #avs button { aspect-ratio: 1; border: 3px solid transparent; border-radius: 14px; background: rgba(255,255,255,.16); font-size: 26px; padding: 0; }
  #avs button.on { border-color: var(--gold); background: rgba(255,255,255,.35); transform: scale(1.08); }
  #cols { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  #cols button { width: 28px; height: 28px; border-radius: 14px; border: 3px solid rgba(255,255,255,.5); padding: 0; }
  #cols button.on { border-color: #fff; transform: scale(1.25); }
  .nrow { display: flex; gap: 6px; width: 100%; max-width: 340px; }
  #dice { width: 48px; height: 48px; border: 0; border-radius: 24px; background: rgba(255,255,255,.25); font-size: 22px; flex: none; }
  .me { margin: 0 auto; width: 96px; height: 96px; border-radius: 48px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 56px; border: 5px solid var(--gold); animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
</style>
</head>
<body>
<div id="map"></div>
<div id="cover" hidden></div>

<div id="top" hidden>
  <div class="card">
    <div id="qn"><span id="qno"></span><span><span id="myScore"></span> <span id="tleft"></span></span></div>
    <div id="prompt"></div>
    <div id="hint"></div>
    <div id="bar"><div id="barIn"></div></div>
  </div>
</div>

<div id="bottom" hidden>
  <div id="readout" hidden></div>
  <div id="pDial" class="card" hidden>
    <div id="dialHost"></div>
    <div id="dRead">แตะ/ลากบนหน้าปัดเพื่อตั้งเข็ม</div>
  </div>
  <div id="pChoice" class="card" hidden></div>
  <div id="pDms" class="card" hidden>
    <div id="flds"></div>
    <div id="keys"></div>
  </div>
  <button id="confirm" class="btn" disabled>แตะแผนที่เพื่อปักหมุด</button>
  <button id="nextBtn" class="btn" hidden style="background:#1e6fb3">ข้อต่อไป ▶</button>
  <div id="result" class="card" hidden></div>
</div>

<canvas id="fx" class="fxc" hidden></canvas>
<div id="screen">
  <h1 id="sTitle">🗺️ เกมแผนที่</h1>
  <p id="sText">เลือกตัวละคร แล้วตั้งชื่อ</p>
  <div id="picker">
    <div id="tabs"></div>
    <div id="avs"></div>
    <div id="cols"></div>
  </div>
  <div class="nrow"><input id="name" maxlength="20" placeholder="ชื่อ หรือ เลขที่" autocomplete="off"><button id="dice" title="สุ่มชื่อ">🎲</button></div>
  <button id="join" class="go">⚔️ เข้าร่วม</button>
  <div id="sExtra"></div>
</div>

<script src="lib/maplibre-gl.js"></script>
<script src="lib/maplibre-contour.min.js"></script>
<script src="geo.js"></script>
<script src="qmap.js"></script>
<script src="dial.js"></script>
<style>#pauseOv[hidden]{display:none!important}</style>
<div id="pauseOv" hidden style="position:fixed;inset:0;z-index:99;background:rgba(10,25,15,.88);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;font-weight:800;text-align:center"><div style="font-size:80px">⏸</div>ครูหยุดเวลา<div style="font-size:20px;font-weight:400;margin-top:8px">รอครูกดเล่นต่อ</div></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var SOLO = /^\/solo\/?$/.test(location.pathname); // โหมดทำเอง: นักเรียนทำคนละเวลา ผลเก็บที่ครู
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var A = { unlock: function () {}, sfx: function () {} }; // เสียงออกที่จอหลักเท่านั้น มือถือเงียบ

  // ---------- เลือกตัวละคร ----------
  var AVS = {
    'สัตว์': ['🦁', '🐯', '🐘', '🦅', '🐺', '🦈', '🐼', '🦊', '🐬', '🦉', '🐙', '🦖'],
    'ทหาร': ['🪖', '🎖️', '🛡️', '🪂', '🚁', '🧭', '⛺', '🔭', '🎯', '🥾', '⚓', '🚤'],
    'การ์ตูน': ['🤖', '👻', '🦸', '🧙', '🥷', '🧛', '🧜', '🧚', '👽', '🐲', '🦄', '🤡'],
    'กีฬา': ['⚽', '🏀', '🏐', '🏸', '🥊', '🏹', '🏓', '🥋', '🚴', '🏊', '🏋️', '⛳']
  };
  var COLS = ['#e53935', '#fb8c00', '#fdd835', '#43a047', '#00acc1', '#1e88e5', '#8e24aa', '#ec407a'];
  var pick = { cat: store.get('mg_cat') || 'สัตว์', av: store.get('mg_av') || '🦁', color: store.get('mg_col') || '#fb8c00' };
  function drawPicker() {
    $('tabs').innerHTML = Object.keys(AVS).map(function (c) { return '<button data-c="' + c + '" class="' + (c === pick.cat ? 'on' : '') + '">' + c + '</button>'; }).join('');
    $('avs').innerHTML = AVS[pick.cat].map(function (a) { return '<button data-a="' + a + '" class="' + (a === pick.av ? 'on' : '') + '">' + a + '</button>'; }).join('');
    $('cols').innerHTML = COLS.map(function (c) { return '<button data-k="' + c + '" class="' + (c === pick.color ? 'on' : '') + '" style="background:' + c + '"></button>'; }).join('');
  }
  $('tabs').onclick = function (e) { var c = e.target.dataset && e.target.dataset.c; if (c) { pick.cat = c; drawPicker(); A.unlock(); A.sfx('pop'); } };
  $('avs').onclick = function (e) { var a = e.target.dataset && e.target.dataset.a; if (a) { pick.av = a; drawPicker(); A.unlock(); A.sfx('pop'); } };
  $('cols').onclick = function (e) { var k = e.target.dataset && e.target.dataset.k; if (k) { pick.color = k; drawPicker(); A.sfx('pop'); } };
  var ADJ = ['สายฟ้า', 'เงียบกริบ', 'ตาเหยี่ยว', 'ไร้เทียมทาน', 'ใจเด็ด', 'ว่องไว', 'พิชิต', 'นักสำรวจ', 'ทะลวง', 'ตัวจริง'];
  var NOUN = ['เสือ', 'เหยี่ยว', 'หมาป่า', 'พยัคฆ์', 'พายุ', 'ทัพหน้า', 'นักล่า', 'ฟ้าผ่า', 'จ่าฝูง', 'ราชา'];
  $('dice').onclick = function () {
    A.unlock(); A.sfx('pop');
    $('name').value = (NOUN[Math.random() * NOUN.length | 0] + ADJ[Math.random() * ADJ.length | 0]).slice(0, 20);
  };
  drawPicker();

  // ---------- แผนที่ ----------
  var qm = QMap.create({ container: 'map', pad: { top: 150, bottom: 110, left: 14, right: 14 }, maxZoom: 19 });
  var map = qm.map;
  var myMarker = null, ansMarker = null;
  function clearMarkers() {
    if (myMarker) { myMarker.remove(); myMarker = null; }
    if (ansMarker) { ansMarker.remove(); ansMarker = null; }
    qm.setAux(null);
  }
  function fmtKm(km) { return km < 1 ? Math.round(km * 1000) + ' ม.' : (km < 10 ? km.toFixed(1) : Math.round(km)) + ' กม.'; }
  var kindOf = function (q) { return q.type === 'compass' ? 'dial' : (q.type === 'dms' || q.type === 'grid' || q.type === 'num' || q.type === 'choice') ? q.type : 'pin'; };
  var TYPED = { dms: 1, grid: 1, num: 1 };

  // ---------- สถานะ ----------
  var S = null, offset = 0, myId = store.get(SOLO ? 'solo_id' : 'mapgame_id'), submitted = false, curQ = -2, curPhase = '', editing = false, es = null, qMs = 25000, lastSec = -1;
  var dial = Dial.create($('dialHost'), { interactive: true, onChange: function (a) { dialChanged(a); } });
  var choiceIdx = null, lastTotal = 0;
  function newDial(night) { dial = Dial.create($('dialHost'), { interactive: true, night: night, onChange: function (a) { dialChanged(a); } }); $('pDial').classList.toggle('night', !!night); }
  var fvals = [], fmax = [], flim = [], fidx = 0, fkind = 'dms';

  // ปักหมุด
  function updateReadout() {
    var q = S && S.q;
    if (!myMarker || !q || q.readout === 'none') { $('readout').hidden = true; return; }
    var ll = myMarker.getLngLat();
    $('readout').hidden = false; $('readout').textContent = q.readout === 'dms' ? QMap.fmtLL(ll.lat, ll.lng) : (q.readout === 'mgrs6' || q.readout === 'mgrs') ? 'MGRS ' + QMap.mgrs6(ll.lat, ll.lng, q.digits) : QMap.fmtDec(ll.lat, ll.lng);
  }
  map.on('click', function (e) {
    if (submitted || !S || S.phase !== 'question' || kindOf(S.q) !== 'pin') return;
    if (!myMarker) {
      myMarker = new maplibregl.Marker({ element: QMap.pinEl('#d93025'), anchor: 'bottom', draggable: true }).setLngLat(e.lngLat).addTo(map);
      myMarker.on('drag', updateReadout);
    } else myMarker.setLngLat(e.lngLat);
    updateReadout(); A.sfx('pop');
    $('confirm').disabled = false; $('confirm').textContent = '✔ ยืนยันคำตอบ';
  });

  // กรอกตัวเลข: องศา ลิปดา ฟิลิปดา | พิกัดกริด 6 หลัก | ตัวเลข (มิลเลียม/องศา)
  function buildKeys(dec) {
    var h = '';
    [1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, dec ? '.' : '➜'].forEach(function (k) { h += '<button data-k="' + k + '"' + (k === '➜' ? ' class="nx"' : '') + '>' + k + '</button>'; });
    $('keys').innerHTML = h;
  }
  buildKeys(false);
  function fld(i) { return '<div class="df" data-i="' + i + '"></div>'; }
  function buildFields(q) {
    fkind = q.type; fidx = 0; buildKeys(!!q.decimal && q.type === 'num');
    if (fkind === 'dms') {
      fmax = [2, 2, 2, 3, 2, 2]; flim = [0, 59, 59, 0, 59, 59];
      $('flds').innerHTML = '<div class="dline"><span class="h">N</span>' + fld(0) + '<span class="du">°</span>' + fld(1) + '<span class="du">′</span>' + fld(2) + '<span class="du">″</span></div>' +
        '<div class="dline"><span class="h">E</span>' + fld(3) + '<span class="du">°</span>' + fld(4) + '<span class="du">′</span>' + fld(5) + '<span class="du">″</span></div>';
    } else if (fkind === 'grid') {
      var dg = q.digits || 3; fmax = [dg, dg]; flim = [0, 0];
      $('flds').innerHTML = '<div class="dline"><span class="h" style="width:auto">E</span>' + fld(0) + '<span class="h" style="width:auto;margin-left:14px">N</span>' + fld(1) + '</div>' +
        '<div style="text-align:center;font-size:12px;color:#666;margin-bottom:4px">พิกัดกริด ' + (dg * 2) + ' หลัก = E ' + dg + ' หลัก + N ' + dg + ' หลัก</div>';
    } else {
      var nd = q.numDigits || 4; fmax = [nd]; flim = [0];
      $('flds').innerHTML = '<div class="dline">' + fld(0) + '<span class="du" style="margin-left:6px">' + (q.numUnit || '') + '</span></div>';
    }
    fvals = fmax.map(function () { return ''; });
    [].forEach.call(document.querySelectorAll('.df'), function (d) { d.onclick = function () { if (!submitted) { fidx = +d.dataset.i; drawFields(); A.sfx('tickLow'); } }; });
    drawFields();
  }
  function fieldsDone() { return fvals.length > 0 && fvals.every(function (v) { return v !== '' && v !== '.' && v.charAt(v.length - 1) !== '.'; }); }
  function drawFields() {
    [].forEach.call(document.querySelectorAll('.df'), function (d) {
      var i = +d.dataset.i; d.textContent = fvals[i]; d.className = 'df' + (i === fidx && !submitted ? ' act' : '');
    });
    var ok = fieldsDone();
    if (!submitted && S && TYPED[kindOf(S.q)]) { $('confirm').disabled = !ok; $('confirm').textContent = ok ? '✔ ยืนยันคำตอบ' : 'กรอกให้ครบ'; }
  }
  $('keys').onclick = function (e) {
    var k = e.target.dataset && e.target.dataset.k; if (k == null || submitted) return;
    A.unlock(); A.sfx('tickLow');
    if (k === '⌫') fvals[fidx] = fvals[fidx].slice(0, -1);
    else if (k === '➜') fidx = (fidx + 1) % fvals.length;
    else if (k === '.') { if (fvals[fidx] !== '' && fvals[fidx].indexOf('.') < 0 && fvals[fidx].length < fmax[fidx]) fvals[fidx] += '.'; }
    else {
      var nv = fvals[fidx] + k;
      if (nv.length <= fmax[fidx] && !(flim[fidx] && +nv > flim[fidx])) {
        fvals[fidx] = nv;
        if (nv.length === fmax[fidx] && fidx < fvals.length - 1) fidx++;
      }
    }
    drawFields();
  };

  // เข็มทิศ
  function dialChanged(a) {
    if (submitted) return;
    var mil = Math.round(a * 6400 / 360) % 6400;

          else { handle(s); setTimeout(loop, 2500); }
        })
        .catch(function (e) { if (g !== soloGen) return; if (e === 404) { store.set('solo_id', ''); myId = null; soloJoinScreen('ไม่พบข้อมูลของคุณในรอบนี้ — พิมพ์ชื่อเล่นเพื่อเข้าใหม่ (ถ้าเคยทำแล้ว ผลเดิมจะยังอยู่ที่ครู แจ้งครูด้วย)'); } else setTimeout(loop, 3000); });
    })();
  }
  function soloNext() {
    if (!S || S.phase !== 'question') return;
    var qi = S.qi; $('nextBtn').disabled = true;
    fetch('api/solo/next', { method: 'POST', body: JSON.stringify({ id: myId, qi: qi }) })
      .catch(function () {}).then(function () { $('nextBtn').disabled = false; soloPoll(); });
  }
  $('nextBtn').onclick = function () { soloNext(); };
  function soloJoinScreen(msg) {
    $('top').hidden = true; $('bottom').hidden = true; $('cover').hidden = true;
    showScreen('📝 ' + esc((S && S.title) || 'ข้อสอบแผนที่'), esc(msg || 'พิมพ์ชื่อเล่น ทำได้ครั้งเดียว'), '', 'join');
  }
  function soloIntro(s) {
    $('top').hidden = true; $('bottom').hidden = true; $('cover').hidden = true;
    showScreen('📝 ' + esc(s.title), 'สวัสดี ' + esc(s.me.name),
      '<p style="line-height:1.7">มีทั้งหมด <b>' + s.total + ' ข้อ</b> ใช้เวลาประมาณ ' + s.minutes + ' นาที<br>แต่ละข้อมีเวลานับถอยหลัง · ทำได้ <b>ครั้งเดียว</b><br>กดยืนยันแล้วแก้ไขได้จนกว่าจะกด "ข้อต่อไป"<br>ต้องมีอินเทอร์เน็ตตลอดการทำ</p><button class="go" id="startBtn" style="margin-top:6px">▶ เริ่มทำ</button>', 'none');
    $('startBtn').onclick = function () { $('startBtn').disabled = true; fetch('api/solo/start', { method: 'POST', body: JSON.stringify({ id: myId }) }).catch(function () {}).then(function () { soloPoll(); }); };
  }
  function soloFinal(s) {
    var r = s.result, when = new Date(r.finishedAt).toLocaleString('th-TH', { hour12: false });
    var rows = r.review.map(function (v) { return '<div style="display:flex;gap:8px;text-align:left;padding:4px 0;border-top:1px solid rgba(255,255,255,.2)"><b style="width:44px;flex:none">ข้อ ' + v.n + '</b><span style="flex:1">' + (r.reveal && v.correct ? 'เฉลย: ' + esc(v.correct) : (v.answered ? 'ตอบแล้ว' : 'ไม่ได้ตอบ')) + '</span><b>' + v.pct.toFixed(0) + '%</b></div>'; }).join('');
    showScreen('🏁 ทำครบแล้ว', esc(r.name) + ' · ลำดับที่ ' + esc(r.no),
      '<div class="pct">' + r.pct.toFixed(1) + '%</div>' +
      '<div style="background:#fff;color:#1b1b1b;border-radius:16px;padding:10px 16px;max-width:330px;width:100%">' +
      '<div style="font-size:13px;color:#555">รหัสยืนยัน</div><div style="font-size:30px;font-weight:800;letter-spacing:2px;font-family:ui-monospace,Menlo,monospace">' + esc(r.code) + '</div>' +
      '<div style="font-size:13px;color:#555;margin-top:2px">' + esc(when) + (r.partial ? ' · ทำไม่ครบ (ปิดรับแล้ว)' : '') + '</div></div>' +
      '<div class="cheer" style="background:rgba(245,179,1,.28);font-weight:700">📸 แคปหน้าจอนี้ แล้วส่งให้ครูเพื่อยืนยันคะแนน<br><span style="font-weight:400;font-size:15px">ต้องเห็นชื่อเล่น คะแนน รหัสยืนยัน และเวลาครบ</span></div>' +
      '<div class="cheer">' + CHEERS[(r.name.length + r.no.length) % CHEERS.length] + '</div>' +
      '<details style="max-width:330px;width:100%;font-size:15px"><summary style="cursor:pointer;opacity:.9">ดูคะแนนแต่ละข้อ' + (r.reveal ? ' + เฉลย' : '') + '</summary>' + rows + '</details>');
    $('screen').className = '';
  }
  function soloJoin() {
    var name = $('name').value.trim();
    if (!name) { $('name').focus(); return; }
    store.set('mapgame_name', name); store.set('mg_cat', pick.cat); store.set('mg_av', pick.av); store.set('mg_col', pick.color);
    fetch('api/solo/join', { method: 'POST', body: JSON.stringify({ id: myId, name: name, av: pick.av, color: pick.color }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.error) {
          var tm = function (t) { return new Date(t).toLocaleString('th-TH', { hour12: false, dateStyle: 'medium', timeStyle: 'short' }); };
          var M = { none: 'ครูยังไม่เปิดให้ทำข้อสอบ', closed: 'ปิดรับแล้ว' + (j.closeAt ? ' (ปิดเมื่อ ' + tm(j.closeAt) + ')' : ''), notyet: 'ยังไม่ถึงเวลาเปิด — เปิดให้ทำตั้งแต่ ' + (j.openAt ? tm(j.openAt) : ''), need: 'พิมพ์ชื่อเล่นก่อน' };
          showScreen('📝 ข้อสอบแผนที่', M[j.error] || 'เข้าร่วมไม่ได้', '', 'join'); return;
        }
        myId = j.id; store.set('solo_id', myId); lastFinalKey = ''; soloPoll();
      })
      .catch(function () { alert('เชื่อมต่อไม่ได้ ตรวจสอบสัญญาณอินเทอร์เน็ต'); });
  }

  function join() {
    if (SOLO) return soloJoin();
    var name = $('name').value.trim();
    if (!name) { $('name').focus(); return; }
    A.unlock(); A.sfx('join');
    store.set('mapgame_name', name); store.set('mg_cat', pick.cat); store.set('mg_av', pick.av); store.set('mg_col', pick.color);
    fetch('api/join', { method: 'POST', body: JSON.stringify({ name: name, av: pick.av, color: pick.color }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { myId = j.id; store.set('mapgame_id', myId); connect(); })
      .catch(function () { alert('เชื่อมต่อไม่ได้ ตรวจสอบสัญญาณอินเทอร์เน็ต'); });
  }
  $('join').onclick = join;
  $('name').addEventListener('keydown', function (e) { if (e.key === 'Enter') join(); });

  if (SOLO) {
    $('dice').hidden = true; $('name').maxLength = 20; $('name').placeholder = 'ชื่อเล่น'; $('sText').textContent = 'พิมพ์ชื่อเล่น ทำได้ครั้งเดียว';
    fetch('api/solo/info').then(function (r) { return r.json(); }).then(function (i) { $('sTitle').innerHTML = '📝 ' + esc(i.title || 'ข้อสอบแผนที่'); var tm = function (t) { return new Date(t).toLocaleString('th-TH', { hour12: false, dateStyle: 'medium', timeStyle: 'short' }); };
      if (i.none) $('sText').textContent = 'ครูยังไม่เปิดให้ทำข้อสอบ';
      else if (i.notYet) $('sText').textContent = 'ยังไม่ถึงเวลาเปิด — เปิดให้ทำตั้งแต่ ' + tm(i.openAt);
      else if (!i.open) $('sText').textContent = 'ปิดรับแล้ว (ถ้าเคยเข้าแล้ว ให้เปิดลิงก์ในเครื่องเดิม)';
      else if (i.closeAt) $('sText').textContent = 'พิมพ์ชื่อเล่น ทำได้ครั้งเดียว · เปิดให้ทำถึง ' + tm(i.closeAt); }).catch(function () {});
  } else fetch('api/info').then(function (r) { return r.json(); }).then(function (i) { $('sTitle').innerHTML = '🗺️ ' + esc(i.title); }).catch(function () {});
  var saved = store.get('mapgame_name'); if (saved) $('name').value = saved;
  if (myId) connect(); // กลับเข้าเกมเดิมอัตโนมัติ
})();
</script>
</body>
</html>
